version: 2

sources:
  - name: raw
    description: "Dados brutos carregados a partir dos ficheiros CSV"
    schema: raw
    tables:
      - name: clientes
        description: "Clientes da Distribuidora Kwanza Comercial"
        columns:
          - name: cliente_id
            description: "Identificador único do cliente"
            tests:
              - unique
              - not_null
          - name: nome
            tests:
              - not_null
          - name: cidade
            tests:
              - not_null

      - name: produtos
        description: "Catálogo de produtos"
        columns:
          - name: produto_id
            tests:
              - unique
              - not_null
          - name: nome_produto
            tests:
              - not_null
          - name: categoria
            tests:
              - not_null

      - name: vendas
        description: "Transações de vendas"
        columns:
          - name: venda_id
            tests:
              - unique
              - not_null
          - name: cliente_id
            tests:
              - not_null
          - name: produto_id
            tests:
              - not_null
          - name: data_venda
            tests:
              - not_null
          - name: valor_liquido
            tests:
              - not_null
